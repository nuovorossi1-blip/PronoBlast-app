[build]
  publish = "frontend/dist"
  command = "cd frontend && npm ci && npm run build:web"

  # L'ignore command e' stato RIMOSSO il 28/07/2026: era il sospettato numero
  # uno dei "deploy fantasma", cioe' build registrate col commit nuovo ma che
  # ripubblicavano i file vecchi. Risparmiare qualche credito non vale il rischio
  # di pubblicare codice che non corrisponde al repository.
  # Il risparmio resta affidato a [skip ci] nei messaggi di commit (vedi
  # CHANGELOG), che e' esplicito e verificabile.

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/predict"
  to = "/.netlify/functions/predict"
  status = 200

